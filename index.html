<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Meta tags PWA para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Agenda">
    
    <!-- Ícono SVG Data URI -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a84ff'/><text x='50%' y='68%' font-size='55' text-anchor='middle' fill='white'>📅</text></svg>">
    
    <title>Mi Agenda Pro Offline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; color: #ffffff; padding: 16px; padding-top: calc(env(safe-area-inset-top) + 16px); max-width: 500px; margin: 0 auto; padding-bottom: 40px; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 14px; color: #0a84ff; text-align: center; }
        
        .card { background-color: #1c1c1e; border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: #8e8e93; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
        input[type="text"], input[type="date"], input[type="time"], select { width: 100%; padding: 12px; border-radius: 10px; border: none; background-color: #2c2c2e; color: #fff; font-size: 15px; outline: none; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        
        /* Botones generales */
        button { cursor: pointer; border: none; font-weight: 600; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }
        
        .add-btn { width: 100%; padding: 14px; border-radius: 12px; background-color: #0a84ff; color: white; font-size: 16px; margin-top: 4px; }
        .notif-btn { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #3a3a3c; background-color: #1c1c1e; color: #30d158; font-size: 13px; margin-bottom: 14px; }
        
        /* Buscador y Filtros */
        .search-box { margin-bottom: 14px; }
        .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-btn { padding: 6px 14px; border-radius: 20px; background-color: #1c1c1e; color: #8e8e93; font-size: 12px; white-space: nowrap; }
        .filter-btn.active { background-color: #0a84ff; color: white; }

        /* Categorías y Badges */
        .cat-row { display: flex; gap: 8px; align-items: center; }
        .add-cat-btn { padding: 12px; background-color: #2c2c2e; color: #0a84ff; border-radius: 10px; font-size: 18px; line-height: 1; }
        .badge { display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase; margin-top: 4px; background-color: rgba(10, 132, 255, 0.2); color: #0a84ff; }

        /* Lista de Eventos */
        .event-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .event-item { background-color: #1c1c1e; border-radius: 14px; padding: 14px; display: flex; align-items: center; justify-content: space-between; }
        .event-info { display: flex; flex-direction: column; gap: 2px; flex: 1; margin: 0 12px; }
        .event-title { font-size: 15px; font-weight: 500; word-break: break-word; }
        .event-time { font-size: 12px; color: #8e8e93; }
        .event-item.completed .event-title { text-decoration: line-through; color: #636366; }
        
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: #30d158; }
        .delete-btn { background: none; color: #ff453a; font-size: 16px; padding: 4px 8px; }

        /* Acciones secundarias */
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn-sec { padding: 10px; border-radius: 10px; background-color: #2c2c2e; color: #8e8e93; font-size: 12px; text-align: center; }
        .btn-danger { background-color: rgba(255, 69, 58, 0.15); color: #ff453a; grid-column: span 2; }
    </style>
</head>
<body>

    <h1>📅 Mi Agenda Pro</h1>

    <button id="notifBtn" class="notif-btn" onclick="requestNotifPermission()">🔔 Activar Notificaciones (10 min antes)</button>
    
    <!-- Formulario para agregar -->
    <div class="card">
        <div class="form-group">
            <label>Evento / Recordatorio</label>
            <input type="text" id="title" placeholder="¿Qué tienes pendiente?">
        </div>
        <div class="row">
            <div class="form-group">
                <label>Categoría</label>
                <div class="cat-row">
                    <select id="category"></select>
                    <button class="add-cat-btn" onclick="addCustomCategory()">+</button>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="date">
            </div>
            <div class="form-group">
                <label>Hora</label>
                <input type="time" id="time">
            </div>
        </div>
        <button class="add-btn" onclick="addEvent()">Agregar a la Agenda</button>
    </div>

    <!-- Buscador -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre..." oninput="renderEvents()">
    </div>

    <!-- Filtros Temporales y Estados -->
    <div class="filter-scroll" id="timeFilters">
        <button class="filter-btn active" onclick="setTimeFilter('Todas', this)">Todas</button>
        <button class="filter-btn" onclick="setTimeFilter('Hoy', this)">Today</button>
        <button class="filter-btn" onclick="setTimeFilter('Semana', this)">Próx. 7 Días</button>
        <button class="filter-btn" onclick="setTimeFilter('Pendientes', this)">Pendientes</button>
        <button class="filter-btn" onclick="setTimeFilter('Completadas', this)">Completadas</button>
    </div>

    <!-- Filtros por Categoría -->
    <div class="filter-scroll" id="categoryFilterBar"></div>

    <!-- Lista de eventos -->
    <div class="event-list" id="eventList"></div>

    <!-- Acciones / Copia de seguridad -->
    <div class="card">
        <label>Gestión de Datos</label>
        <div class="action-grid">
            <button class="btn-sec" onclick="exportData()">📥 Exportar JSON</button>
            <label class="btn-sec" style="cursor:pointer;">
                📤 Importar JSON
                <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display:none;">
            </label>
            <button class="btn-sec btn-danger" onclick="cleanCompleted()">🧹 Limpiar Tareas Completadas</button>
        </div>
    </div>

    <script>
        const dateInput = document.getElementById('date');
        const timeInput = document.getElementById('time');
        
        let currentTimeFilter = 'Todas';
        let currentCatFilter = 'Todas';
        
        const defaultCategories = ['💼 Trabajo', '👤 Personal', '🏋️ Gym', '📚 Estudio', '📌 Otro'];

        // Cargar fecha y hora actuales por defecto
        const now = new Date();
        dateInput.value = now.toISOString().split('T')[0];
        timeInput.value = now.toTimeString().slice(0, 5);

        function getEvents() {
            return JSON.parse(localStorage.getItem('iphone_agenda_db') || '[]');
        }

        function saveEvents(events) {
            localStorage.setItem('iphone_agenda_db', JSON.stringify(events));
        }

        function getCategories() {
            return JSON.parse(localStorage.getItem('iphone_agenda_cats') || JSON.stringify(defaultCategories));
        }

        function saveCategories(cats) {
            localStorage.setItem('iphone_agenda_cats', JSON.stringify(cats));
        }

        function populateCategorySelects() {
            const cats = getCategories();
            const select = document.getElementById('category');
            select.innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');

            const filterBar = document.getElementById('categoryFilterBar');
            filterBar.innerHTML = `<button class="filter-btn ${currentCatFilter === 'Todas' ? 'active' : ''}" onclick="setCatFilter('Todas', this)">Todas Cat.</button>` +
                cats.map(c => `<button class="filter-btn ${currentCatFilter === c ? 'active' : ''}" onclick="setCatFilter('${c}', this)">${c}</button>`).join('');
        }

        function addCustomCategory() {
            const newCat = prompt("Nombre de la nueva categoría:");
            if (newCat && newCat.trim()) {
                const cats = getCategories();
                const formatted = `🏷️ ${newCat.trim()}`;
                if (!cats.includes(formatted)) {
                    cats.push(formatted);
                    saveCategories(cats);
                    populateCategorySelects();
                }
            }
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch(e) {}
        }

        function requestNotifPermission() {
            if (!("Notification" in window)) {
                alert("Este navegador no soporta notificaciones.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById('notifBtn').innerText = "✅ Notificaciones Activadas";
                    document.getElementById('notifBtn').style.color = "#30d158";
                }
            });
        }

        function checkNotifications() {
            if (!("Notification" in window) || Notification.permission !== "granted") return;

            const events = getEvents();
            const currentTime = new Date();
            let updated = false;

            events.forEach(ev => {
                if (ev.completed || ev.notified) return;

                const eventDateTime = new Date(`${ev.date}T${ev.time}`);
                const diffMinutes = (eventDateTime - currentTime) / (1000 * 60);

                if (diffMinutes > 0 && diffMinutes <= 10) {
                    playBeep();
                    new Notification(`⏰ En 10 min: ${ev.title}`, {
                        body: `Categoría: ${ev.category} — Hora: ${ev.time}`,
                        icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a84ff'/><text x='50%' y='68%' font-size='55' text-anchor='middle' fill='white'>📅</text></svg>"
                    });
                    ev.notified = true;
                    updated = true;
                }
            });

            if (updated) saveEvents(events);
        }

        setInterval(checkNotifications, 30000);

        function setTimeFilter(filter, btn) {
            currentTimeFilter = filter;
            document.querySelectorAll('#timeFilters .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderEvents();
        }

        function setCatFilter(cat, btn) {
            currentCatFilter = cat;
            document.querySelectorAll('#categoryFilterBar .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderEvents();
        }

        function renderEvents() {
            const events = getEvents();
            const list = document.getElementById('eventList');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const todayStr = new Date().toISOString().split('T')[0];
            
            const nextWeek = new Date();
            nextWeek.setDate(nextWeek.getDate() + 7);
            const nextWeekStr = nextWeek.toISOString().split('T')[0];

            list.innerHTML = '';

            let filtered = events.filter(ev => {
                // Buscador
                if (search && !ev.title.toLowerCase().includes(search)) return false;
                
                // Filtro Categoría
                if (currentCatFilter !== 'Todas' && ev.category !== currentCatFilter) return false;

                // Filtro Tiempo / Estado
                if (currentTimeFilter === 'Hoy') return ev.date === todayStr;
                if (currentTimeFilter === 'Semana') return ev.date >= todayStr && ev.date <= nextWeekStr;
                if (currentTimeFilter === 'Pendientes') return !ev.completed;
                if (currentTimeFilter === 'Completadas') return ev.completed;

                return true;
            });

            if (filtered.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #8e8e93; padding: 20px;">No se encontraron eventos.</p>';
                return;
            }

            filtered.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

            filtered.forEach((ev) => {
                const realIndex = events.findIndex(e => e.title === ev.title && e.date === ev.date && e.time === ev.time);
                const item = document.createElement('div');
                item.className = `event-item ${ev.completed ? 'completed' : ''}`;
                
                item.innerHTML = `
                    <input type="checkbox" ${ev.completed ? 'checked' : ''} onchange="toggleEvent(${realIndex})">
                    <div class="event-info">
                        <span class="event-title">${escapeHtml(ev.title)}</span>
                        <span class="event-time">📅 ${ev.date} — 🕒 ${ev.time}</span>
                        <div><span class="badge">${ev.category}</span></div>
                    </div>
                    <button class="delete-btn" onclick="deleteEvent(${realIndex})">✕</button>
                `;
                list.appendChild(item);
            });
        }

        function addEvent() {
            const titleInput = document.getElementById('title');
            const categoryInput = document.getElementById('category');
            const title = titleInput.value.trim();
            const category = categoryInput.value;
            const date = dateInput.value;
            const time = timeInput.value;

            if (!title) return;

            const events = getEvents();
            events.push({ title, category, date, time, completed: false, notified: false });
            saveEvents(events);
            
            titleInput.value = '';
            renderEvents();
            checkNotifications();
        }

        function toggleEvent(index) {
            const events = getEvents();
            events[index].completed = !events[index].completed;
            saveEvents(events);
            renderEvents();
        }

        function deleteEvent(index) {
            const events = getEvents();
            events.splice(index, 1);
            saveEvents(events);
            renderEvents();
        }

        function cleanCompleted() {
            if (confirm("¿Deseas borrar permanentemente todas las tareas marcadas como completadas?")) {
                const events = getEvents().filter(e => !e.completed);
                saveEvents(events);
                renderEvents();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(getEvents(), null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `agenda_backup_${new Date().toISOString().split('T')[0]}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const fileReader = new FileReader();
            fileReader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        saveEvents(imported);
                        renderEvents();
                        alert("¡Respaldo importado con éxito!");
                    }
                } catch(err) {
                    alert("El archivo subido no es un JSON válido.");
                }
            };
            fileReader.readAsText(event.target.files[0]);
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        if ("Notification" in window && Notification.permission === "granted") {
            document.getElementById('notifBtn').innerText = "✅ Notificaciones Activadas";
            document.getElementById('notifBtn').style.color = "#30d158";
        }

        populateCategorySelects();
        renderEvents();
    </script>
</body>
</html>
