<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Meta tags para que iOS lo abra como microapp nativa -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Agenda">
    <title>Mi Agenda Offline</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #000000; color: #ffffff; padding: 20px; padding-top: calc(env(safe-area-inset-top) + 20px); max-width: 500px; margin: 0 auto; }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 20px; color: #0a84ff; text-align: center; }
        
        .card { background-color: #1c1c1e; border-radius: 16px; padding: 16px; margin-bottom: 24px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: #8e8e93; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
        input[type="text"], input[type="date"], input[type="time"] { width: 100%; padding: 12px; border-radius: 10px; border: none; background-color: #2c2c2e; color: #fff; font-size: 16px; outline: none; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        
        button.add-btn { width: 100%; padding: 14px; border-radius: 12px; border: none; background-color: #0a84ff; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        button.add-btn:active { opacity: 0.7; }
        
        .event-list { display: flex; flex-direction: column; gap: 10px; }
        .event-item { background-color: #1c1c1e; border-radius: 14px; padding: 14px; display: flex; align-items: center; justify-content: space-between; }
        .event-info { display: flex; flex-direction: column; gap: 4px; flex: 1; margin: 0 12px; }
        .event-title { font-size: 16px; font-weight: 500; word-break: break-word; }
        .event-time { font-size: 13px; color: #8e8e93; }
        .event-item.completed .event-title { text-decoration: line-through; color: #636366; }
        
        input[type="checkbox"] { width: 22px; height: 22px; accent-color: #30d158; cursor: pointer; }
        .delete-btn { background: none; border: none; color: #ff453a; font-size: 16px; font-weight: bold; cursor: pointer; padding: 4px 8px; }
    </style>
</head>
<body>

    <h1>📅 Mi Agenda</h1>
    
    <div class="card">
        <div class="form-group">
            <label>Evento o Recordatorio</label>
            <input type="text" id="title" placeholder="¿Qué tienes pendiente?">
        </div>
        <div class="row">
            <div class="form-group">
                <label>Fecha</label>
                <input type="date" id="date">
            </div>
            <div class="form-group">
                <label>Hora</label>
                <input type="time" id="time">
            </div>
        </div>
        <button class="add-btn" onclick="addEvent()">Agregar a la Agenda</button>
    </div>

    <div class="event-list" id="eventList"></div>

    <script>
        const dateInput = document.getElementById('date');
        const timeInput = document.getElementById('time');
        
        // Cargar fecha y hora actuales por defecto
        const now = new Date();
        dateInput.value = now.toISOString().split('T')[0];
        timeInput.value = now.toTimeString().slice(0, 5);

        function getEvents() {
            return JSON.parse(localStorage.getItem('iphone_agenda_db') || '[]');
        }

        function saveEvents(events) {
            localStorage.setItem('iphone_agenda_db', JSON.stringify(events));
        }

        function renderEvents() {
            const events = getEvents();
            const list = document.getElementById('eventList');
            list.innerHTML = '';

            if (events.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #8e8e93; padding: 20px;">No hay eventos registrados.</p>';
                return;
            }

            // Ordenar por fecha y hora
            events.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

            events.forEach((ev, index) => {
                const item = document.createElement('div');
                item.className = `event-item ${ev.completed ? 'completed' : ''}`;
                item.innerHTML = `
                    <input type="checkbox" ${ev.completed ? 'checked' : ''} onchange="toggleEvent(${index})">
                    <div class="event-info">
                        <span class="event-title">${escapeHtml(ev.title)}</span>
                        <span class="event-time">📅 ${ev.date} — 🕒 ${ev.time}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteEvent(${index})">✕</button>
                `;
                list.appendChild(item);
            });
        }

        function addEvent() {
            const titleInput = document.getElementById('title');
            const title = titleInput.value.trim();
            const date = dateInput.value;
            const time = timeInput.value;

            if (!title) return;

            const events = getEvents();
            events.push({ title, date, time, completed: false });
            saveEvents(events);
            
            titleInput.value = '';
            renderEvents();
        }

        function toggleEvent(index) {
            const events = getEvents();
            events[index].completed = !events[index].completed;
            saveEvents(events);
            renderEvents();
        }

        function deleteEvent(index) {
            const events = getEvents();
            events.splice(index, 1);
            saveEvents(events);
            renderEvents();
        }

        function escapeHtml(text) {
            return text.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        renderEvents();
    </script>
</body>
</html>
